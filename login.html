<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for evreyone</title>
    <link rel="icon" type="image/x-icon" href="../images/slogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="path/to/normalize.css">
<style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #121212, #181818);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #181818;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.8);
            height:90%;
        }

        .login-container img {
            margin-bottom: 1rem;
        }

        .login-container h1 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            background-color: #181818;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 1.5rem;
            background-color: #181818;
        }

        .social-login button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #282828;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            gap: 15px;
            transition: background 0.3s ease;
        }

        .social-login button:hover {
            background: #333333;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
            background-color: #181818;
        }

        .login-form input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333333;
            background-color: #121212;
            color: white;
        }

        .login-form input:focus {
            outline: none;
            border: 1px solid #1db954;
        }

        .login-form button {
            background-color: #1db954;
            color: black;
            border: none;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-form button:hover {
            background-color: #1ed760;
        }

        .footer-links {
            font-size: 14px;
            margin-top: 2rem;
        }
        .footer-links p{
            background-color: #181818;
        }

        .footer-links a {
            color: #1db954;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify Logo" width="150">
        <h1>Log in to Spotify</h1>

        <div class="social-login">
            <button><i class="fab fa-google"></i> Continue with Google</button>
            <button><i class="fab fa-facebook"></i> Continue with Facebook</button>
            <button><i class="fab fa-apple"></i> Continue with Apple</button>
            <button><i class="fas fa-phone"></i> Continue with phone number</button>
        </div>

        <form class="login-form">
            <input type="text" placeholder="Email or username">
            <input type="password" placeholder="Password">
            <button type="submit">Log In</button>
        </form>

        <div class="footer-links">
            <p><a href="#">Forgot your password?</a></p>
            <p>Don't have an account? <a href="#">Sign up for Spotify</a></p>
        </div>
    </div>
</body>
</html>
